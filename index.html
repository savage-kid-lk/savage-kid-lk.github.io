<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elixirium: Orb Sort Alchemy</title>
<meta name="description" content="Elixirium: Orb Sort Alchemy, a free Android puzzle game by Letago Kekana.">
<style>
  :root { --bg: #140f24; --panel: #1e1638; --text: #ede3cf; --muted: #a79bc8; --gold: #ffe6a0; --link: #ffd45c; --line: rgba(157,123,255,.25); }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #faf7f0; --panel: #fff; --text: #231c33; --muted: #5d5470; --gold: #7a5600; --link: #7a4d00; --line: rgba(80,60,140,.18); } }
  :root[data-theme="light"] { --bg: #faf7f0; --panel: #fff; --text: #231c33; --muted: #5d5470; --gold: #7a5600; --link: #7a4d00; --line: rgba(80,60,140,.18); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; text-align: center; }
  img { width: 128px; height: 128px; border-radius: 28px; box-shadow: 0 10px 40px rgba(245,197,24,.25); }
  h1 { font-family: Georgia, serif; color: var(--gold); margin: 18px 0 4px; font-size: clamp(1.8rem, 6vw, 2.4rem); }
  p { color: var(--muted); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-top: 28px; text-align: left; }
  a { color: var(--link); }
  ul { padding-left: 20px; margin: 6px 0 0; }
</style>
</head>
<body>
<main>
  <img src="elixirium/icon.png" alt="Elixirium icon: three glowing orbs">
  <h1>Elixirium</h1>
  <p>Orb Sort Alchemy: sort glowing elemental orbs into crystal flasks across 2,500 procedurally generated levels, with Hard and Very Hard challenges.</p>
  <div class="card">
    <strong>Elixirium</strong>
    <ul>
      <li><a href="elixirium/privacy.html">Privacy Policy</a></li>
      <li><a href="elixirium/terms.html">Terms of Use</a></li>
      <li>Support and privacy requests: <a href="mailto:kekanaletago58@gmail.com">kekanaletago58@gmail.com</a></li>
    </ul>
  </div>
  <p style="margin-top:32px;font-size:.9rem">© 2026 Letago Kekana · South Africa</p>
</main>
</body>
</html>
